<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">minishell · 명령 처리 흐름</title><desc id="desc">Readline 입력을 검사한 뒤 Token으로 분리하고 heredoc, 환경 변수 확장, 문법 검사를 수행한다. 실행 단계에서는 파이프와 리다이렉션에 맞게 파일 디스크립터를 연결하고 Builtin 또는 외부 명령을 실행한 뒤 표준 입출력과 종료 상태를 정리한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
