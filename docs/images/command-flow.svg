<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">minishell · 명령 처리 흐름</title><desc id="desc">Readline 입력을 Token으로 나누고 heredoc과 환경 변수 확장, 문법 검사와 정리를 수행한 뒤 파이프와 리다이렉션을 연결하고 Builtin 또는 외부 명령을 실행한다.</desc>
