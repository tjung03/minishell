<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">minishell · 입력 해석 흐름</title>
<desc id="desc">Readline으로 받은 입력을 검사하고 Token으로 분리한 뒤 heredoc 입력을 준비하고 환경 변수를 확장한다. 이후 문법 검사와 Token 정리를 마치면 실행 단계로 넘긴다.</desc>
