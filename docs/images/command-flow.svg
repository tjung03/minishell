<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">minishell · 명령 처리 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">입력 · 해석 · FD 연결 · 명령 실행 · Shell 상태 복원</text>

