<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">minishell · 명령 실행 흐름</title>
<desc id="desc">exec_start가 Token을 기준으로 파이프와 리다이렉션 파일 디스크립터를 연결한다. Builtin이면 셸 프로세스에서 명령을 실행하고, 외부 명령이면 PATH 탐색 후 fork와 execve를 사용한다. 실행 후 표준 입출력과 파일 디스크립터를 복원하고 종료 상태를 반영한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#64748b"/></marker></defs>
<rect width="1000" height="430" rx="16" fill="#f8fafc"/>
<g font-family="Arial,'Noto Sans CJK KR','Malgun Gothic',sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#17253b">minishell · 명령 실행 흐름</text>
<text x="32" y="74" font-size="16" fill="#4b5e78">FD 연결 · Builtin / External · Shell 상태 복원</text>

<rect x="32" y="108" width="936" height="252" rx="12" fill="#ecf8f4" stroke="#a9d5c6"/>

<rect x="68" y="183" width="205" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="88" y="212" font-size="17" font-weight="700" fill="#086b62">exec_start()</text>
<text x="88" y="239" font-size="14" fill="#263a54">Pipe · Redirect · heredoc FD</text>

<rect x="335" y="128" width="215" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="355" y="157" font-size="17" font-weight="700" fill="#086b62">Builtin</text>
<text x="355" y="184" font-size="14" fill="#263a54">cd · export · echo …</text>

<rect x="335" y="238" width="215" height="88" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="355" y="267" font-size="17" font-weight="700" fill="#086b62">External Command</text>
<text x="355" y="294" font-size="14" fill="#263a54">PATH 탐색 · fork · execve</text>

<rect x="625" y="183" width="285" height="88" rx="10" fill="#fff6ea" stroke="#e5cba9"/>
<text x="647" y="212" font-size="17" font-weight="700" fill="#946018">명령 처리 후</text>
<text x="647" y="239" font-size="14" fill="#263a54">STDIN/STDOUT 복원 · FD 정리</text>
<text x="647" y="260" font-size="14" fill="#263a54">waitpid · Exit Status 반영</text>

<path d="M273 205 H315 V172 H335" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M273 249 H315 V282 H335" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 172 H590 V205 H615" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M550 282 H590 V249 H615" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

<text x="74" y="392" font-size="14" fill="#475569">그림은 팀 프로젝트 전체의 실행 흐름이며, 개인 기여 범위는 README의 협업과 기여 섹션에서 별도로 구분</text>
</g></svg>